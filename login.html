<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Big Basket Satnali account for easy ordering, fast delivery, and order tracking.">
  <title>Login — Big Basket Satnali</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: var(--color-background-alt);">

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <!-- Logo -->
      <a href="index.html" class="auth-brand-logo" aria-label="Big Basket Home">
        <img src="assets/logo/logo.png" alt="Big Basket Satnali" style="height: 52px; width: auto;">
      </a>

      <h1 class="auth-card-title">Welcome Back</h1>
      <p class="auth-card-subtitle">Sign in to your Big Basket grocery account</p>

      <!-- Global Alert Feedback -->
      <div id="auth-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 600; margin-bottom: 1.25rem;"></div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <!-- Mobile / Email -->
        <div class="form-group">
          <label for="login-identifier" class="form-label">Mobile Number or Email <span class="required">*</span></label>
          <div class="input-icon-wrap">
            <span class="input-icon">📱</span>
            <input type="text" id="login-identifier" class="form-input" placeholder="e.g. 9876543210 or name@example.com" autocomplete="username" required>
          </div>
          <div class="form-feedback" id="identifier-feedback">Please enter a valid email or 10-digit mobile number.</div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="login-password" class="form-label">Password <span class="required">*</span></label>
          <div class="input-icon-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
          <div class="form-feedback" id="password-feedback">Please enter your password.</div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="auth-options-row">
          <label class="form-checkbox-label">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html" class="forgot-password-link">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login-submit" style="font-size: 1rem; font-weight: 800;">
          Sign In ➔
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span>OR</span>
      </div>

      <!-- Google Social Login (Demo) -->
      <button type="button" class="btn-google-auth" onclick="handleGoogleLogin()">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Switch to Register -->
      <div class="auth-card-footer">
        Don't have an account? <a href="register.html">Create New Account</a>
      </div>

      <!-- Dedicated Admin Portal Link -->
      <div style="margin-top: 1.25rem; padding-top: 1rem; border-top: 1px dashed var(--color-border); text-align: center;">
        <a href="admin/login.html" style="font-size: 0.85rem; font-weight: 700; color: #0f172a; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;">
          🛡️ Store Staff / Administrator Login ➔
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle password view
      const toggleBtn = document.getElementById('toggle-password-btn');
      const passInput = document.getElementById('login-password');
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passInput.type === 'password';
          passInput.type = isPassword ? 'text' : 'password';
          toggleBtn.textContent = isPassword ? '🙈' : '👁️';
        });
      }

      // Form Submission
      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('auth-alert');
      const submitBtn = document.getElementById('btn-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;
        const remember = document.getElementById('remember-me').checked;

        // Reset errors
        document.getElementById('login-identifier').classList.remove('is-invalid');
        document.getElementById('login-password').classList.remove('is-invalid');
        document.getElementById('identifier-feedback').classList.remove('is-error');
        document.getElementById('password-feedback').classList.remove('is-error');
        alertBox.style.display = 'none';

        let hasError = false;

        if (!identifier) {
          document.getElementById('login-identifier').classList.add('is-invalid');
          document.getElementById('identifier-feedback').classList.add('is-error');
          hasError = true;
        }

        if (!password) {
          document.getElementById('login-password').classList.add('is-invalid');
          document.getElementById('password-feedback').classList.add('is-error');
          hasError = true;
        }

        if (hasError) return;

        // Submit loading state
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
          const res = await BigBasketAuth.loginUser(identifier, password, remember);

          if (res.success) {
            alertBox.style.display = 'block';
            alertBox.style.background = '#dcfce7';
            alertBox.style.color = '#15803d';
            alertBox.style.border = '1px solid #bbf7d0';
            alertBox.textContent = `Welcome back, ${res.user.name}! Redirecting...`;

            // Check redirect query param
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || 'account.html';

            setTimeout(() => {
              window.location.href = redirect;
            }, 700);
          } else {
            alertBox.style.display = 'block';
            alertBox.style.background = '#fef2f2';
            alertBox.style.color = '#dc2626';
            alertBox.style.border = '1px solid #fecaca';
            alertBox.textContent = res.message || 'Login failed. Please verify credentials.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In ➔';
          }
        } catch (err) {
          console.error(err);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In ➔';
        }
      });
    });

    function handleGoogleLogin() {
      // Demo Social Login
      BigBasketAuth.loginUser('abhishek.sharma@example.com', 'password123');
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect') || 'account.html';
      window.location.href = redirect;
    }
  </script>
</body>
</html>
