<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View detailed invoice and live timeline tracking for your Big Basket Satnali grocery order.">
  <title>Order Details & Tracking — Big Basket Satnali</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-main">
        <a href="index.html" class="brand-logo" aria-label="Big Basket Satnali Home">
          <img src="assets/logo/logo.png" alt="Big Basket Satnali" class="brand-logo-img">
        </a>
        <a href="orders.html" class="btn btn-secondary btn-sm">← Back to All Orders</a>
      </div>
    </div>
  </header>

  <!-- Breadcrumbs -->
  <div class="container">
    <nav class="breadcrumb-nav" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-separator">/</li>
        <li class="breadcrumb-item"><a href="account.html">My Account</a></li>
        <li class="breadcrumb-separator">/</li>
        <li class="breadcrumb-item"><a href="orders.html">Orders</a></li>
        <li class="breadcrumb-separator">/</li>
        <li class="breadcrumb-item active" aria-current="page">Order Details</li>
      </ol>
    </nav>
  </div>

  <!-- Order Details Layout -->
  <main class="container">
    <div class="account-page-layout">
      <!-- Left Sidebar -->
      <aside class="account-sidebar">
        <div class="account-user-card">
          <div class="account-avatar">👤</div>
          <div class="account-user-info">
            <div class="account-user-name" id="sidebar-user-name">Abhishek Sharma</div>
            <div class="account-user-phone" id="sidebar-user-phone">+91 98765 43210</div>
          </div>
        </div>

        <ul class="account-nav-list">
          <li class="account-nav-item"><a href="account.html">🏠 Dashboard</a></li>
          <li class="account-nav-item active"><a href="orders.html">📦 My Orders</a></li>
          <li class="account-nav-item"><a href="wishlist.html">❤️ My Wishlist</a></li>
          <li class="account-nav-item"><a href="addresses.html">📍 Saved Addresses</a></li>
          <li class="account-nav-item"><a href="profile.html">⚙️ Profile Settings</a></li>
          <li class="account-nav-divider"></li>
          <li class="account-nav-item">
            <button type="button" onclick="BigBasketAuth.logoutUser()" style="color: #dc2626;">🚪 Logout</button>
          </li>
        </ul>
      </aside>

      <!-- Right Main Order Details Container -->
      <section class="account-main-content">
        <div id="order-detail-container"></div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" style="margin-top: 4rem;">
    <div class="container">
      <div class="footer-bottom">
        <div class="footer-bottom-content">
          <p class="copyright-text">© 2026 Big Basket Satnali. All rights reserved.</p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!BigBasketAuth.requireAuth('orders.html')) return;

      const user = BigBasketAuth.getCurrentUser();
      if (user) {
        document.getElementById('sidebar-user-name').textContent = user.name;
        document.getElementById('sidebar-user-phone').textContent = user.mobile ? `+91 ${user.mobile}` : user.email;
      }

      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('id') || 'BB102938';
      BigBasketOrders.renderOrderDetails(orderId);
    });
  </script>
</body>
</html>
