<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Big Basket Satnali account password via secure OTP verification.">
  <title>Forgot Password — Big Basket Satnali</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: var(--color-background-alt);">

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <a href="index.html" class="auth-brand-logo" aria-label="Big Basket Home">
        <img src="assets/logo/logo.png" alt="Big Basket Satnali" style="height: 52px; width: auto;">
      </a>

      <h1 class="auth-card-title">Forgot Password?</h1>
      <p class="auth-card-subtitle">Enter your registered mobile or email to receive an OTP</p>

      <div id="forgot-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 600; margin-bottom: 1.25rem;"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="forgot-target" class="form-label">Registered Mobile or Email <span class="required">*</span></label>
          <div class="input-icon-wrap">
            <span class="input-icon">📱</span>
            <input type="text" id="forgot-target" class="form-input" placeholder="e.g. 9876543210 or name@example.com" required>
          </div>
          <div class="form-feedback" id="forgot-feedback">Please enter your registered mobile or email.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-send-otp" style="font-size: 1rem; font-weight: 800;">
          Send OTP ➔
        </button>
      </form>

      <div class="auth-card-footer">
        Remember your password? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('forgot-target').value.trim();
      const alertBox = document.getElementById('forgot-alert');
      const input = document.getElementById('forgot-target');
      const feedback = document.getElementById('forgot-feedback');

      input.classList.remove('is-invalid');
      feedback.classList.remove('is-error');

      if (!val) {
        input.classList.add('is-invalid');
        feedback.classList.add('is-error');
        return;
      }

      alertBox.style.display = 'block';
      alertBox.style.background = '#eff6ff';
      alertBox.style.color = '#1d4ed8';
      alertBox.style.border = '1px solid #bfdbfe';
      alertBox.textContent = `Demo OTP flow initiated! Sending 6-digit OTP to ${val}...`;

      setTimeout(() => {
        window.location.href = `verify-otp.html?target=${encodeURIComponent(val)}`;
      }, 1000);
    });
  </script>
</body>
</html>
