<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set a new secure password for your Big Basket Satnali account.">
  <title>Reset Password — Big Basket Satnali</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: var(--color-background-alt);">

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <a href="index.html" class="auth-brand-logo" aria-label="Big Basket Home">
        <img src="assets/logo/logo.png" alt="Big Basket Satnali" style="height: 52px; width: auto;">
      </a>

      <h1 class="auth-card-title">Reset Password</h1>
      <p class="auth-card-subtitle">Choose a strong, secure password for your account</p>

      <div id="reset-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 600; margin-bottom: 1.25rem;"></div>

      <form id="reset-form" novalidate>
        <!-- New Password -->
        <div class="form-group">
          <label for="new-password" class="form-label">New Password <span class="required">*</span></label>
          <div class="input-icon-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="new-password" class="form-input" placeholder="At least 6 characters" required>
            <button type="button" class="password-toggle-btn" id="toggle-new-pass">👁️</button>
          </div>

          <!-- Password Strength Meter -->
          <div class="password-strength-wrap" id="strength-container">
            <div class="strength-meter-track">
              <div class="strength-segment"></div>
              <div class="strength-segment"></div>
              <div class="strength-segment"></div>
            </div>
            <span class="strength-text" id="strength-label">Password Strength: Empty</span>
          </div>
          <div class="form-feedback" id="new-pass-feedback">Password must be at least 6 characters.</div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirm New Password <span class="required">*</span></label>
          <div class="input-icon-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter password" required>
          </div>
          <div class="form-feedback" id="confirm-pass-feedback">Passwords do not match.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-reset-submit" style="font-size: 1rem; font-weight: 800;">
          Save New Password ➔
        </button>
      </form>

      <div class="auth-card-footer">
        Back to <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const passInput = document.getElementById('new-password');
      const confirmInput = document.getElementById('confirm-password');
      const strengthBox = document.getElementById('strength-container');
      const strengthLabel = document.getElementById('strength-label');
      const toggleBtn = document.getElementById('toggle-new-pass');

      // Toggle view
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', () => {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
          toggleBtn.textContent = isPass ? '🙈' : '👁️';
        });
      }

      // Password Strength Logic
      passInput.addEventListener('input', () => {
        const val = passInput.value;
        strengthBox.className = 'password-strength-wrap';

        if (val.length === 0) {
          strengthLabel.textContent = 'Password Strength: Empty';
          return;
        }

        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10 || (/[A-Z]/.test(val) && /[0-9]/.test(val))) score++;
        if (/[^A-Za-z0-9]/.test(val) && val.length >= 8) score++;

        if (score === 1) {
          strengthBox.classList.add('strength-weak');
          strengthLabel.textContent = 'Password Strength: Weak';
        } else if (score === 2) {
          strengthBox.classList.add('strength-medium');
          strengthLabel.textContent = 'Password Strength: Medium';
        } else if (score >= 3) {
          strengthBox.classList.add('strength-strong');
          strengthLabel.textContent = 'Password Strength: Strong 🔥';
        }
      });

      // Submit Form
      const form = document.getElementById('reset-form');
      const alertBox = document.getElementById('reset-alert');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const p1 = passInput.value;
        const p2 = confirmInput.value;

        passInput.classList.remove('is-invalid');
        confirmInput.classList.remove('is-invalid');
        document.getElementById('new-pass-feedback').classList.remove('is-error');
        document.getElementById('confirm-pass-feedback').classList.remove('is-error');

        let hasError = false;

        if (!p1 || p1.length < 6) {
          passInput.classList.add('is-invalid');
          document.getElementById('new-pass-feedback').classList.add('is-error');
          hasError = true;
        }

        if (p1 !== p2) {
          confirmInput.classList.add('is-invalid');
          document.getElementById('confirm-pass-feedback').classList.add('is-error');
          hasError = true;
        }

        if (hasError) return;

        alertBox.style.display = 'block';
        alertBox.style.background = '#dcfce7';
        alertBox.style.color = '#15803d';
        alertBox.style.border = '1px solid #bbf7d0';
        alertBox.textContent = 'Password reset successfully! Redirecting to Sign In...';

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      });
    });
  </script>
</body>
</html>
